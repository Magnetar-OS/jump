[package]
name = "jump-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# The engine is deliberately MPL-2.0 while the COSMIC frontend is GPL-3.0-only:
# a future GTK4/GNOME frontend links this crate without absorbing the app's
# licence. Keep UI dependencies out of here to preserve that split.
license = "MPL-2.0"
description = "Search engine, ranking, and plugin host for the jump launcher"

# crates.io front matter. `readme` is what the crate page renders, and it is a
# crate-local file rather than the workspace README: that one describes the
# COSMIC application, which is not what an importer of this crate is getting.
readme = "README.md"
homepage = "https://github.com/entro314-labs/jump"
documentation = "https://docs.rs/jump-core"
keywords = ["launcher", "search", "fuzzy", "frecency", "desktop"]
categories = ["os::linux-apis", "text-processing", "filesystem"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# Protocol types for the pop-launcher IPC service. Using the upstream crate
# rather than hand-rolled structs keeps us wire-compatible as plugins evolve.
pop-launcher = "1.2"

futures = "0.3.34"
thiserror = "2"
dirs = "7.0"

# Plugin manifests are TOML; plugin *responses* are JSON (Alfred-compatible).
toml = "1.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
emojis = "0.9.0"

[dev-dependencies]
tempfile = "3.27.0"
