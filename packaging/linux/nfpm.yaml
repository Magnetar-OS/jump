# nfpm config for the .deb, .rpm and Arch .pkg.tar.zst — consumed by
# linux-release-kit's release.yml. The file layout is NOT declared here:
# the workflow's build_command stages it with the justfile's own
# `just rootdir=... install`, and the single tree entry below packages
# whatever the justfile installed. One source of truth for the layout.
#
# The RK_* variables are exported by the release workflow; nfpm expands
# ${VAR} itself. You never edit the version here.

name: jump
arch: ${RK_DEB_ARCH}
platform: linux
version: ${RK_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Dominikos Pritis <dominikos.pritis@gmail.com>
vendor: entro314-labs
homepage: https://github.com/Magnetar-OS/jump
# The packaged artefact is the launcher binaries, which are GPL-3.0-only.
# Only the `jump-core` engine crate is MPL-2.0, and it is not what ships here.
license: GPL-3.0-only
description: |
  Search applications, windows, files, and clipboard

# Runtime dependencies, per distro. The libraries are PROVISIONAL — derived
# from the -sys crates in Cargo.lock; after the first CI build, trim against
# `ldd target/release/jump`. The arch names are validated for real by
# arch-repo.yml's container install test.
#
# The programs Jump runs are declared by what happens without them:
#
#   pop-launcher  required. It is the search engine; without it no query is
#                 answered at all. Debian and Ubuntu do not carry it — it
#                 comes from Pop!_OS's repository — so the .deb installs
#                 where COSMIC itself came from a repository that has it.
#   xdg-utils     required. `xdg-open` is how a file, a link, a quicklink and
#                 a web search are opened; without it those rows do nothing.
#   plocate       file search, on by default. Without it file search answers
#                 nothing and everything else works: recommended.
#   bsdtar        only `jump plugin import` of an .alfredworkflow archive,
#                 which says so when it is missing: recommended.
#
# nfpm's Arch packager writes `depend` only — it has no optdepends — so on
# Arch the two recommended programs are hard dependencies. That costs
# nothing for bsdtar (libarchive, which pacman itself depends on) and one
# small package with no enabled service for plocate.
overrides:
  deb:
    depends:
      - libxkbcommon0
      - libsqlite3-0
      - pop-launcher
      - xdg-utils
    recommends:
      - plocate
      - libarchive-tools
  rpm:
    depends:
      - libxkbcommon
      - sqlite-libs
      - pop-launcher
      - xdg-utils
    recommends:
      - plocate
      - bsdtar
  archlinux:
    depends:
      - libxkbcommon
      - sqlite
      - pop-launcher
      - xdg-utils
      - plocate
      - libarchive

contents:
  # Everything `just rootdir=.release-kit/pkgroot install` staged: binaries,
  # desktop entries, icons, metainfo, services — applets and daemons
  # included. Modes are preserved from the staging tree.
  #
  # One tree per top-level directory, NOT a single tree at `/`: a tree whose
  # dst is `/` makes nfpm emit a tar entry with an empty name, and bsdtar
  # errors out on it ("Archive entry has empty or unreadable filename"), so
  # `repo-add` rejects the Arch package as "not a package file" and the pacman
  # repository never updates. The .deb and .rpm tolerate it, which is why this
  # only ever shows up on Arch.
  #
  # This justfile installs under the prefix only. A new top-level directory in
  # the install tree needs a new entry here.
  - src: .release-kit/pkgroot/usr
    dst: /usr
    type: tree
